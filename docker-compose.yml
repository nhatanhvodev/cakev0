version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gau-bakery-app
    ports:
      - "8080:80"
    volumes:
      - upload_data:/var/www/html/assets/uploads
      - page_uploads:/var/www/html/pages/uploads
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_TIMEZONE=Asia/Ho_Chi_Minh
      - APP_BASE_PATH=/cakev0
      - APP_ORIGIN=http://localhost:8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASS=root_password
      - DB_NAME=banh_store
      - DB_CHARSET=utf8mb4
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-GO1IEGFS}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-FALJ15YAAF9B9AEWXHVGBVQL6WO4SONA}
      - VNPAY_URL=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - VNPAY_RETURN_URL=http://localhost:8080/cakev0/vnpay/vnpay_return.php
      - VNPAY_MERCHANT_URL=http://sandbox.vnpayment.vn/merchant_webapi/merchant.html
      - VNPAY_TRANSACTION_API_URL=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
      - UPLOADTHING_TOKEN=${UPLOADTHING_TOKEN:-eyJhcGlLZXkiOiJza19saXZlXzY1ODEwZTRlOWZjYWUxMmEyM2MyZGRiYWQ0NWVjNzAyNGQxY2RiY2I4MDJiZTg3MmVlOGE5ZjQzM2VjN2FkZjciLCJhcHBJZCI6Ingyanp1eTUzbnYiLCJyZWdpb25zIjpbInNlYTEiXX0=}
      - UPLOADTHING_APP_ID=${UPLOADTHING_APP_ID:-x2jzuy53nv}
      - MAIL_DRIVER=${MAIL_DRIVER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Gau Bakery}
      - MAIL_TIMEOUT=${MAIL_TIMEOUT:-300}
      - MAIL_FORCE_IPV4=${MAIL_FORCE_IPV4:-true}
      - MAIL_DEBUG=${MAIL_DEBUG:-false}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - GMAIL_USER_ID=${GMAIL_USER_ID:-me}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bakery-net

  db:
    image: mysql:8.0
    container_name: gau-bakery-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: banh_store
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_general_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./database/banh_store.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - bakery-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gau-bakery-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bakery-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: gau-bakery-ai
    ports:
      - "8000:8000"
    environment:
      - ENGINE=${ENGINE:-multiagent}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.0-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root_password
      - MYSQL_DATABASE=banh_store
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-change-me}
      - INTERNAL_ORDER_API_URL=http://app/cakev0/api/internal/orders/create.php
      - HANDOFF_CONFIDENCE_THRESHOLD=${HANDOFF_CONFIDENCE_THRESHOLD:-0.6}
      - FB_PAGE_TOKEN=${FB_PAGE_TOKEN:-}
      - FB_VERIFY_TOKEN=${FB_VERIFY_TOKEN:-}
      - FB_APP_SECRET=${FB_APP_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - SITE_BASE_URL=http://app/cakev0
      - ENABLE_NORMALIZER=${ENABLE_NORMALIZER:-true}
    volumes:
      - ai_chroma_data:/app/data/chroma_db
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
    networks:
      - bakery-net

volumes:
  db_data:
  upload_data:
  page_uploads:
  ai_chroma_data:


networks:
  bakery-net:
    driver: bridge
