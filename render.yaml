services:
  - type: web
    name: gau-bakery
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /cakev0/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: APP_BASE_PATH
        value: /cakev0
      - key: APP_ORIGIN
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_CHARSET
        value: utf8mb4
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_RETURN_URL
        sync: false
      - key: VNPAY_MERCHANT_URL
        value: http://sandbox.vnpayment.vn/merchant_webapi/merchant.html
      - key: VNPAY_TRANSACTION_API_URL
        value: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
      - key: UPLOADTHING_API_KEY
        sync: false
      - key: UPLOADTHING_TOKEN
        sync: false
      - key: UPLOADTHING_APP_ID
        sync: false
      - key: MAIL_DRIVER
        value: gmail_api
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Gau Bakery
      - key: MAIL_TIMEOUT
        value: "300"
      - key: MAIL_FORCE_IPV4
        value: "true"
      - key: MAIL_DEBUG
        value: "false"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_USER_ID
        value: me
      - key: INTERNAL_API_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false

  - type: web
    name: gau-bakery-ai
    runtime: docker
    plan: free
    region: singapore
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENGINE
        value: multiagent
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_MODEL
        value: text-embedding-004
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma_db
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: banh_store
      - key: MYSQL_SSL
        value: "true"
      - key: INTERNAL_API_SECRET
        sync: false
      - key: INTERNAL_ORDER_API_URL
        value: https://cake-i8l0.onrender.com/cakev0/api/internal/orders/create.php
      - key: HANDOFF_CONFIDENCE_THRESHOLD
        value: "0.6"
      - key: CORS_ORIGINS
        value: https://cake-i8l0.onrender.com
      - key: SITE_BASE_URL
        value: https://cake-i8l0.onrender.com/cakev0
      - key: ENABLE_NORMALIZER
        value: "true"
      - key: FB_PAGE_TOKEN
        sync: false
      - key: FB_VERIFY_TOKEN
        sync: false
      - key: FB_APP_SECRET
        sync: false
