[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gau-bakery-ai-service"
version = "0.1.0"
description = "FastAPI multiagent chatbot service for Gau Bakery"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "langchain>=0.1.10",
    "langchain-google-genai>=0.0.1",
    "langgraph>=0.0.30",
    "chromadb>=0.4.24",
    "google-generativeai>=0.3.0",
    "pydantic>=2.5.2",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymysql>=1.1.0",
    "httpx>=0.27.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["app"]
