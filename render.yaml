# Render Blueprint — chỉ định nghĩa ai-service (Python FastAPI).
# Web PHP (cake-i8l0.onrender.com) tạo/quản lý riêng, không nằm trong blueprint này —
# cấu hình env web xem docs/deployment/render-aiven.md.
# Nhớ thêm vào web service (manual): INTERNAL_API_SECRET (cùng value ai) + AI_SERVICE_URL.
services:
  - type: web
    name: gau-bakery-ai
    runtime: docker
    plan: free
    region: singapore
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENGINE
        value: multiagent
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma_db
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: defaultdb
      - key: MYSQL_SSL
        value: "true"
      - key: INTERNAL_API_SECRET
        sync: false
      - key: INTERNAL_ORDER_API_URL
        value: https://cake-i8l0.onrender.com/cakev0/api/internal/orders/create.php
      - key: HANDOFF_CONFIDENCE_THRESHOLD
        value: "0.6"
      - key: CORS_ORIGINS
        value: https://cake-i8l0.onrender.com
      - key: SITE_BASE_URL
        value: https://cake-i8l0.onrender.com/cakev0
      - key: ENABLE_NORMALIZER
        value: "true"
      - key: FB_PAGE_TOKEN
        sync: false
      - key: FB_VERIFY_TOKEN
        sync: false
      - key: FB_APP_SECRET
        sync: false
